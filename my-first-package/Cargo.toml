[package]
name = "my-first-package"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "watch"
path = "src/bin/watch.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
notify-debouncer-full = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
