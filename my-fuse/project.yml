name: Eidra
options:
  bundleIdPrefix: com.roundcolors
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_TEAM: ""

targets:
  Eidra:
    type: application
    platform: macOS
    sources:
      - Eidra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roundcolors.eidra
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: Eidra
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Eidra/Eidra.entitlements
    dependencies:
      - target: EidraProvider

  EidraProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: EidraProvider
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roundcolors.eidra.provider
        PRODUCT_NAME: EidraProvider
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: EidraProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: EidraProvider/EidraProvider.entitlements
    dependencies: []
