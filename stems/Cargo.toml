[package]
name = "stems"
version = "0.1.0"
edition = "2021"

# Multiple binary entry points
[[bin]]
name = "qt-storybook"
path = "src/qt_storybook_main.rs"

[[bin]]
name = "multi-player"
path = "src/multi_main.rs"

[[bin]]
name = "waveform-analyzer"
path = "src/waveform_analyzer_main.rs"


[dependencies]
# QML + Rust integration
qmetaobject = { version = "0.2.10", default-features = false, features = ["log"] }
qttypes = { version = "0.2.12", default-features = false, features = ["required", "qtquick", "qtquickcontrols2"] }

# Audio I/O and processing
cpal = "0.15"
hound = "3.5"
memmap2 = "0.9"
symphonia = { version = "0.5", features = ["all"] }

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

# Async and threading
tokio = { version = "1.0", features = ["full"] }
parking_lot = "0.12"
atomic_float = "1.1"
rayon = "1.9"

# QML utilities
cstr = "0.2"

# Phase 3A: Waveform generation
audio-visualizer = "0.5.0"
sonogram = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
rustfft = "6.1"
num-complex = "0.4"
png = "0.17"
walkdir = "2.5.0"
notify-debouncer-full = "0.6.0"
pyo3 = { version = "0.25.1", features = ["auto-initialize"] }
pythonize = "0.25"
aubio-rs = { version = "0.2.0", features = ["builtin", "bindgen"] }
url = "2.5.4"

[build-dependencies]
cc = "1.2"
cpp_build = "0.5.9"
pyo3-build-config = "0.25.1"
walkdir = "2.5.0"
winres = "0.1.12"
